name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: survey_test
          POSTGRES_USER: survey
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U survey -d survey_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen --extra local --extra dev --extra postgres
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync pytest -q
        env:
          TEST_DATABASE_URL: postgresql://survey:disposable-ci-password@127.0.0.1:5432/survey_test
      - run: uv build --out-dir dist/packages
      - run: uv run --no-sync python scripts/check_package.py dist/packages/survey_machine-0.1.0-py3-none-any.whl
  browser-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
      - run: uv sync --frozen --extra local --extra dev --group workers
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:browser
        env:
          SM_TEST_D1: "1"
      - run: npm run build:cloudflare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: test-results/
          retention-days: 7
