[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-machine"
version = "0.1.0"
description = "An embeddable survey service with a Python API, Cloudflare Workers, D1, and PostgreSQL support."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["fastapi>=0.115,<1"]

[project.optional-dependencies]
local = ["uvicorn[standard]>=0.34,<1", "python-dotenv>=1,<2"]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[dependency-groups]
workers = ["workers-py", "workers-runtime-sdk"]

[tool.setuptools.packages.find]
include = ["survey_machine*"]

[tool.setuptools.package-data]
survey_machine = ["web/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
